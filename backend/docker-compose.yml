services:
  postgres:
    image: postgres:15
    container_name: imoblink_cont
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: imoblink_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d

  api-imoblink:
    build: .
    container_name: imoblink_api_cont
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=${ENV_PROFILE}
    env_file:
      - .env
      - .env.${ENV_PROFILE}

volumes:
  postgres_data:
