version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: imoblink_cont
    restart: always
    environment:
      POSTGRES_USER: imoblink
      POSTGRES_PASSWORD: imoblink
      POSTGRES_DB: imoblink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
